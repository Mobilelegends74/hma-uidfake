name: Legacy download badge (manual only)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: download-count-badge
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Test aggregate download count
        run: python3 scripts/test-downloads-badge.py
      - name: Refresh count from GitHub release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update-downloads-badge.py
      - name: Commit badge only when count changes
        run: |
          git add docs/assets/downloads.svg
          if git diff --cached --quiet; then
            echo "Download count is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refresh downloads badge [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
