name: Validate native kernel patches

on:
  push:
    branches: [kernel-patches]
  pull_request:
    branches: [kernel-patches]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Native policy and netlink regression tests
        run: python3 scripts/uidfake-test-native.py
      - name: Verify patch checksums
        run: sha256sum --check patches/SHA256SUMS
      - name: Apply reference patches and verify KABI and idempotence
        run: python3 scripts/uidfake-test-patches.py
      - name: Validate tools and native-only workflow boundaries
        run: python3 scripts/uidfake-test-kit.py
      - name: Packaging format regression (synthetic non-bootable fixture)
        run: python3 scripts/uidfake-test-packaging.py
  compile:
    name: Built-in ARM64 ${{ matrix.kmi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kmi: [android12-5.10, android13-5.10, android13-5.15, android14-5.15, android14-6.1, android15-6.6, android16-6.12, android17-6.18]
    container:
      image: ghcr.io/ylarod/ddk:${{ matrix.kmi }}-20260828
    steps:
      - uses: actions/checkout@v7
      - name: Compile native archive and affected kernel objects
        run: bash scripts/uidfake-compile-ddk.sh '${{ matrix.kmi }}'
      - name: Retain source patch and compile report (not a flashable kernel)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: native-check-${{ matrix.kmi }}
          path: out/${{ matrix.kmi }}/
