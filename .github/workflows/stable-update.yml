name: Sync stable module update
on:
  release:
    types: [published, released, edited]
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: write
concurrency:
  group: stable-module-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Generate stable-only metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/test-stable-update.py
          python3 scripts/sync-stable-update.py
      - name: Commit metadata only
        run: |
          git add update.json update-changelog.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update stable module feed [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
