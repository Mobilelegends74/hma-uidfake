name: build

on:
  push:
    tags: ['v*-fork']
    paths-ignore:
      - 'README.md'
      - 'README_EN.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  # One job per KMI, built inside the matching DDK container.
  lkm:
    name: hma_uidfake.ko (${{ matrix.kmi }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk:${{ matrix.kmi }}-20260828
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    steps:
      - uses: actions/checkout@v7
        with:
          # The module version comes from git (tag + short hash), so the tags have to be here.
          fetch-depth: 0
          submodules: recursive
      - name: Check formatting
        run: bash scripts/check-format.sh
      - name: Build
        run: |
          set -euo pipefail
          KDIR="${KDIR:-/opt/ddk/kdir/${{ matrix.kmi }}}"
          [ -f "$KDIR/Makefile" ] || { echo "no kernel tree at $KDIR"; exit 1; }
          python3 scripts/restore-modpost.py "/opt/ddk/src/${{ matrix.kmi }}"
          test -s "$KDIR/Module.symvers"
          head -n 3 "$KDIR/Module.symvers"
          # An external M= build reuses the DDK host tools without rebuilding
          # modpost. Prepare them explicitly after restoring its source.
          make -C "$KDIR" ARCH=arm64 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare

          # kbuild writes objects into the M= directory, so build from a stage dir
          # that only contains symlinks to src/ to keep the checkout clean.
          stage="$RUNNER_TEMP/stage/${{ matrix.kmi }}"
          mkdir -p "$stage" out
          for f in src/*; do ln -sfn "$PWD/$f" "$stage/$(basename "$f")"; done

          # CROSS_COMPILE is what a tree this old takes its target triple from; without it clang
          # emits bitcode for the host and the LTO link says "incompatible with aarch64elf".
          make -C "$KDIR" ARCH=arm64 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- M="$stage" modules
          llvm-strip -d "$stage/hma_uidfake.ko" || true
          # A custom android13-5.15 kernel rejected the previous package on
          # this optional debug-only dependency. Check the actual ELF imports.
          imports="$(llvm-nm --undefined-only "$stage/hma_uidfake.ko")"
          printf '%s\n' "$imports"
          if printf '%s\n' "$imports" | grep -qw static_key_count; then
            echo 'Unexpected static_key_count import: diagnostic branch regression'
            exit 1
          fi
          cp "$stage/hma_uidfake.ko" "out/${{ matrix.kmi }}_arm64_hma_uidfake.ko"
      - uses: actions/upload-artifact@v7
        with:
          name: ko-${{ matrix.kmi }}
          path: out/*.ko
          if-no-files-found: error

  oneplus:
    name: Audit source-built OnePlus 6.12.38 variant
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: out-oneplus
          key: oneplus-61238-${{ hashFiles('src/*.c', 'src/include/**', 'src/Makefile', 'compat/oneplus-6.12.38/kernel.config', 'scripts/build-oneplus-61238.sh') }}
      - uses: actions/download-artifact@v8
        if: steps.native-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        with:
          name: oneplus-61238-source-build
          run-id: 39631748812
          github-token: ${{ github.token }}
          path: native-build
      - name: Reuse exact sources or rebuild native variant
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          if [ -s native-build/src.manifest.sha256 ] && sha256sum -c native-build/src.manifest.sha256; then
            mkdir -p out-oneplus
            cp native-build/* out-oneplus/
          else
            sudo apt-get update
            sudo apt-get install -y bc bison flex libssl-dev libelf-dev libdw-dev dwarves zstd libzstd-dev cpio rsync
            bash scripts/build-oneplus-61238.sh
          fi
      - name: Verify exact module sources and kernel ABI
        run: |
          set -euo pipefail
          sha256sum -c out-oneplus/src.manifest.sha256
          sudo apt-get update
          sudo apt-get install -y llvm
          mkdir -p out profiles
          cp out-oneplus/*_arm64_hma_uidfake.ko out/
          llvm-strip -d out/*.ko
          python3 scripts/check-oneplus-abi.py out/android16-6.12-oneplus-6.12.38_arm64_hma_uidfake.ko profiles/17975ac76c1fafe0c23e057f7d865b962878279d.abi
      - uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: out-oneplus
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v7
        with:
          name: ko-oneplus-61238
          path: out/*.ko
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: oneplus-kernel-profile
          path: profiles/*.abi
          if-no-files-found: error

  pack:
    name: pack module zip
    runs-on: ubuntu-latest
    needs: [lkm, oneplus]
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # lkmloader is built here, from external/lkmloader.
          submodules: recursive
      - uses: actions/download-artifact@v8
        with:
          path: build/ko
          pattern: ko-*
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: oneplus-kernel-profile
          path: module/kernel-profiles
      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nlohmann-json3-dev g++ zlib1g-dev
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          # Do not reuse a partially restored NDK archive; the local cache can
          # contain source.properties while missing the LLVM toolchain.
          local-cache: false
      - name: Validate NDK toolchain
        run: |
          set -euo pipefail
          ndk="${{ steps.ndk.outputs.ndk-path }}"
          test -x "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          test -f "$ndk/build/cmake/android.toolchain.cmake"
      - name: Configure
        run: |
          set -euo pipefail
          cmake -S . -B build \
            -DUG_NDK="${{ steps.ndk.outputs.ndk-path }}" \
            -DUG_USE_PREBUILT_KO=ON
      - name: Test KMI mapping and shell scripts
        run: |
          set -euo pipefail
          for f in module/*.sh; do sh -n "$f"; done
          bash scripts/test-kmi-map.sh
      - name: Validate WebUI JavaScript
        run: |
          set -euo pipefail
          node --check module/webroot/app.js
          node --check module/webroot/i18n.js
          node --check module/webroot/help.js
          node scripts/test-webui-i18n.cjs
          node scripts/test-webui-help.cjs
          python3 scripts/test-diagnostics.py
          python3 scripts/test-source-mode.py
          python3 scripts/test-kernel-image-abi.py
          python3 scripts/test-manual-inject.py
          python3 scripts/test-debug-key.py
          python3 scripts/test-stable-update.py
          python3 scripts/test-module-abi.py
          node scripts/test-webui-diagnostics.cjs
          grep -q 'report_status(active_kernel_policy' src/tools/sync.cpp
          grep -q -- '--get-config' src/tools/sync.cpp
          grep -q -- '--set-config' src/tools/sync.cpp
      - name: Build and pack
        run: |
          set -euo pipefail
          cmake --build build -j"$(nproc)"
          ls -la build/dist
          zip=$(find build/dist -maxdepth 1 -name '*.zip' -type f -print -quit)
          test -n "$zip"
          unzip -t "$zip"
          unzip -p "$zip" module.prop | grep -q '^version=0[.]3[.]15-test-fork+'
          unzip -p "$zip" module.prop | grep -q '^versionCode=3015$'
          unzip -Z1 "$zip" | grep -qx 'ko/android16-6.12-oneplus-6.12.38_arm64_hma_uidfake.ko'
          unzip -Z1 "$zip" | grep -qx 'kernel-profiles/17975ac76c1fafe0c23e057f7d865b962878279d.abi'
          unzip -Z1 "$zip" | grep -qx 'manual-inject.sh'
          unzip -Z1 "$zip" | grep -qx 'kernel-profiles/c35dd83674df6260539509ea6671b906d2fa3a23.abi'
          for kmi in android12-5.10 android13-5.10 android13-5.15 android14-5.15 android14-6.1 android15-6.6 android16-6.12 android17-6.18; do
            unzip -Z1 "$zip" | grep -qx "ko/${kmi}_arm64_hma_uidfake.ko"
          done
          [ "$(find build/ko -maxdepth 1 -name '*_arm64_hma_uidfake.ko' | wc -l)" -eq 9 ]
          unzip -p "$zip" post-fs-data.sh | grep -q 'uidfake_load'
          unzip -p "$zip" service.sh | grep -q 'uidfake_load'
          unzip -Z1 "$zip" | grep -qx 'webroot/index.html'
          unzip -Z1 "$zip" | grep -qx 'webroot/app.js'
          unzip -Z1 "$zip" | grep -qx 'webroot/i18n.js'
          unzip -Z1 "$zip" | grep -qx 'webroot/help.js'
          unzip -p "$zip" module.prop | grep -q '^description=❌ Not working$'
          unzip -Z1 "$zip" | grep -qx 'webroot/locale.js'
          unzip -p "$zip" module.prop | grep -q '^name=HMA UID Fake fork \[TEST\]$'
          unzip -Z1 "$zip" | grep -qx 'diagnostics.sh'
          unzip -Z1 "$zip" | grep -qx 'webroot/style.css'
          unzip -Z1 "$zip" | grep -qx 'load.sh'
          unzip -Z1 "$zip" | grep -qx 'kmi-tool'
          if unzip -p "$zip" load.sh | grep -Eq 'ksud insmod|lkmloader.*\$'; then
            echo "Unsafe alternate loader in boot path"
            exit 1
          fi
          if unzip -p "$zip" post-fs-data.sh | grep -q allow_load; then
            echo "Manual activation requirement must not exist"
            exit 1
          fi
          if unzip -p "$zip" webroot/app.js | grep -q '/data/local/tmp/hma-uidfake-webui.json'; then
            echo "Insecure temp config export present"
            exit 1
          fi
          unzip -p "$zip" service.sh | grep -q 'uidfake_load'
          unzip -p "$zip" module.prop | grep -qx 'updateJson=https://raw.githubusercontent.com/Mobilelegends74/hma-uidfake/main/update.json'
          sha256sum "$zip"
          mv "$zip" build/dist/hma-uidfake-fork-0.3.15-test.zip
          (cd build/dist && sha256sum hma-uidfake-fork-0.3.15-test.zip > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: module-zip
          path: build/dist/*.zip
          # Without this the zip is put inside an archive of the artifact's own,
          # so what a user downloads is a zip holding the module zip. With it the
          # artifact carries the file's name, not the `name:` above.
          archive: false
      - name: Prepare release draft
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: HMA UID Fake fork 0.3.15 TEST — OnePlus 6.12.38 и обновления
          body_path: docs/releases/v0.3.15-test-fork.md
          draft: false
          prerelease: true
          make_latest: false
          files: |
            build/dist/hma-uidfake-fork-0.3.15-test.zip
            build/dist/SHA256SUMS
