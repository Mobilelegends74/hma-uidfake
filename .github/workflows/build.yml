name: build

on:
  push:
    branches: [main, build/android14-6.1-compat, feature/webui-audited-build-v2, feature/ru-en-webui-fork-readme, test/context-help-status-v036]
    tags: ["v*"]
  pull_request:
    branches: [main, build/android14-6.1-compat]
  workflow_dispatch:

jobs:
  # One job per KMI, built inside the matching DDK container.
  lkm:
    name: hma_uidfake.ko (${{ matrix.kmi }})
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk:${{ matrix.kmi }}-20260828
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    steps:
      - uses: actions/checkout@v7
        with:
          # The module version comes from git (tag + short hash), so the tags have to be here.
          fetch-depth: 0
          submodules: recursive
      - name: Check formatting
        run: bash scripts/check-format.sh
      - name: Build
        run: |
          set -euo pipefail
          KDIR="${KDIR:-/opt/ddk/kdir/${{ matrix.kmi }}}"
          [ -f "$KDIR/Makefile" ] || { echo "no kernel tree at $KDIR"; exit 1; }

          # kbuild writes objects into the M= directory, so build from a stage dir
          # that only contains symlinks to src/ to keep the checkout clean.
          stage="$RUNNER_TEMP/stage/${{ matrix.kmi }}"
          mkdir -p "$stage" out
          for f in src/*; do ln -sfn "$PWD/$f" "$stage/$(basename "$f")"; done

          # CROSS_COMPILE is what a tree this old takes its target triple from; without it clang
          # emits bitcode for the host and the LTO link says "incompatible with aarch64elf".
          make -C "$KDIR" ARCH=arm64 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- M="$stage" modules
          llvm-strip -d "$stage/hma_uidfake.ko" || true
          cp "$stage/hma_uidfake.ko" "out/${{ matrix.kmi }}_arm64_hma_uidfake.ko"
      - uses: actions/upload-artifact@v7
        with:
          name: ko-${{ matrix.kmi }}
          path: out/*.ko
          if-no-files-found: error

  pack:
    name: pack module zip
    runs-on: ubuntu-latest
    needs: lkm
    # The tag run publishes from this job, where the zip is: an artifact cannot
    # be searched for by a name that is certain (see the upload below), and a
    # download of it can hand the zip back unpacked.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # lkmloader is built here, from external/lkmloader.
          submodules: recursive
      - uses: actions/download-artifact@v8
        with:
          path: build/ko
          pattern: ko-*
          merge-multiple: true
      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nlohmann-json3-dev
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          # Do not reuse a partially restored NDK archive; the local cache can
          # contain source.properties while missing the LLVM toolchain.
          local-cache: false
      - name: Validate NDK toolchain
        run: |
          set -euo pipefail
          ndk="${{ steps.ndk.outputs.ndk-path }}"
          test -x "$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++"
          test -f "$ndk/build/cmake/android.toolchain.cmake"
      - name: Configure
        run: |
          set -euo pipefail
          cmake -S . -B build \
            -DUG_NDK="${{ steps.ndk.outputs.ndk-path }}" \
            -DUG_USE_PREBUILT_KO=ON
      - name: Test KMI mapping and shell scripts
        run: |
          set -euo pipefail
          for f in module/*.sh; do sh -n "$f"; done
          bash scripts/test-kmi-map.sh
      - name: Validate WebUI JavaScript
        run: |
          set -euo pipefail
          node --check module/webroot/app.js
          node --check module/webroot/i18n.js
          node --check module/webroot/help.js
          node --check module/webroot/app.js
          node scripts/test-webui-i18n.cjs
          node scripts/test-webui-help.cjs
          grep -q 'report_status(active_kernel_policy' src/tools/sync.cpp
          grep -q -- '--get-config' src/tools/sync.cpp
          grep -q -- '--set-config' src/tools/sync.cpp
      - name: Build and pack
        run: |
          set -euo pipefail
          cmake --build build -j"$(nproc)"
          ls -la build/dist
          zip=$(find build/dist -maxdepth 1 -name '*.zip' -type f -print -quit)
          test -n "$zip"
          unzip -t "$zip"
          unzip -p "$zip" module.prop | grep -q '^version=0[.]3[.]6-test+'
          for kmi in android12-5.10 android13-5.10 android13-5.15 android14-5.15 android14-6.1 android15-6.6 android16-6.12 android17-6.18; do
            unzip -Z1 "$zip" | grep -qx "ko/${kmi}_arm64_hma_uidfake.ko"
          done
          [ "$(find build/ko -maxdepth 1 -name '*_arm64_hma_uidfake.ko' | wc -l)" -eq 8 ]
          unzip -p "$zip" post-fs-data.sh | grep -q 'uidfake_load'
          unzip -p "$zip" service.sh | grep -q 'uidfake_load'
          unzip -Z1 "$zip" | grep -qx 'webroot/index.html'
          unzip -Z1 "$zip" | grep -qx 'webroot/app.js'
          unzip -Z1 "$zip" | grep -qx 'webroot/i18n.js'
          unzip -Z1 "$zip" | grep -qx 'webroot/help.js'
          unzip -p "$zip" module.prop | grep -q '^description=❌ Not working
          unzip -Z1 "$zip" | grep -qx 'webroot/locale.js'
          unzip -p "$zip" module.prop | grep -q '^name=HMA UID Fake fork$'
          unzip -Z1 "$zip" | grep -qx 'webroot/style.css'
          unzip -Z1 "$zip" | grep -qx 'load.sh'
          if unzip -p "$zip" post-fs-data.sh | grep -q allow_load; then
            echo "Manual activation requirement must not exist"
            exit 1
          fi
          if unzip -p "$zip" webroot/app.js | grep -q '/data/local/tmp/hma-uidfake-webui.json'; then
            echo "Insecure temp config export present"
            exit 1
          fi
          unzip -p "$zip" service.sh | grep -q 'uidfake_load'
          if unzip -p "$zip" module.prop | grep -q '^updateJson='; then
            echo "External updater URL must not be present in audited test build"
            exit 1
          fi
          sha256sum "$zip"
      - uses: actions/upload-artifact@v7
        with:
          name: module-zip
          path: build/dist/*.zip
          # Without this the zip is put inside an archive of the artifact's own,
          # so what a user downloads is a zip holding the module zip. With it the
          # artifact carries the file's name, not the `name:` above.
          archive: false
      - name: Write update.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          zip=$(ls build/dist/*.zip)
          # The packed module.prop already carries what this build computed, so the JSON cannot
          # disagree with the module it describes.
          version=$(unzip -p "$zip" module.prop | sed -n 's/^version=//p')
          code=$(unzip -p "$zip" module.prop | sed -n 's/^versionCode=//p')
          tag="${{ github.ref_name }}"
          asset=$(basename "$zip")
          changelog="https://raw.githubusercontent.com/${{ github.repository }}/$tag/CHANGELOG.md"
          grep -qF "${version%%+*}" CHANGELOG.md ||
            { echo "CHANGELOG.md has no entry for $version"; exit 1; }
          cat > build/dist/update.json <<JSON
          {
            "version": "$version",
            "versionCode": $code,
            "zipUrl": "https://github.com/${{ github.repository }}/releases/download/$tag/$asset",
            "changelog": "$changelog"
          }
          JSON
          cat build/dist/update.json
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: build/dist/*
          generate_release_notes: true
      # module.prop points updateJson at releases/latest/download/update.json, so it is this
      # asset -- not a file in the repository -- that the module manager reads.

      # Stable filename: README always downloads the newest published module ZIP.
      - name: Prepare stable module ZIP
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          zip=$(find build/dist -maxdepth 1 -name 'hma-uidfake-*.zip' -type f -print -quit)
          test -n "$zip"
          cp "$zip" build/dist/hma-uidfake-fork-latest.zip
          unzip -t build/dist/hma-uidfake-fork-latest.zip
          sha256sum build/dist/*.zip
      - name: Publish HMA UID Fake fork v0.3.5
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.5-fork
          target_commitish: ${{ github.sha }}
          name: 'HMA UID Fake fork v0.3.5 — RU/EN WebUI'
          body_path: docs/releases/v0.3.5-fork.md
          files: build/dist/*.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true

          unzip -Z1 "$zip" | grep -qx 'webroot/locale.js'
          unzip -p "$zip" module.prop | grep -q '^name=HMA UID Fake fork$'
          unzip -Z1 "$zip" | grep -qx 'webroot/style.css'
          unzip -Z1 "$zip" | grep -qx 'load.sh'
          if unzip -p "$zip" post-fs-data.sh | grep -q allow_load; then
            echo "Manual activation requirement must not exist"
            exit 1
          fi
          if unzip -p "$zip" webroot/app.js | grep -q '/data/local/tmp/hma-uidfake-webui.json'; then
            echo "Insecure temp config export present"
            exit 1
          fi
          unzip -p "$zip" service.sh | grep -q 'uidfake_load'
          if unzip -p "$zip" module.prop | grep -q '^updateJson='; then
            echo "External updater URL must not be present in audited test build"
            exit 1
          fi
          sha256sum "$zip"
      - uses: actions/upload-artifact@v7
        with:
          name: module-zip
          path: build/dist/*.zip
          # Without this the zip is put inside an archive of the artifact's own,
          # so what a user downloads is a zip holding the module zip. With it the
          # artifact carries the file's name, not the `name:` above.
          archive: false
      - name: Write update.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          zip=$(ls build/dist/*.zip)
          # The packed module.prop already carries what this build computed, so the JSON cannot
          # disagree with the module it describes.
          version=$(unzip -p "$zip" module.prop | sed -n 's/^version=//p')
          code=$(unzip -p "$zip" module.prop | sed -n 's/^versionCode=//p')
          tag="${{ github.ref_name }}"
          asset=$(basename "$zip")
          changelog="https://raw.githubusercontent.com/${{ github.repository }}/$tag/CHANGELOG.md"
          grep -qF "${version%%+*}" CHANGELOG.md ||
            { echo "CHANGELOG.md has no entry for $version"; exit 1; }
          cat > build/dist/update.json <<JSON
          {
            "version": "$version",
            "versionCode": $code,
            "zipUrl": "https://github.com/${{ github.repository }}/releases/download/$tag/$asset",
            "changelog": "$changelog"
          }
          JSON
          cat build/dist/update.json
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: build/dist/*
          generate_release_notes: true
      # module.prop points updateJson at releases/latest/download/update.json, so it is this
      # asset -- not a file in the repository -- that the module manager reads.

      # Stable filename: README always downloads the newest published module ZIP.
      - name: Prepare stable module ZIP
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          zip=$(find build/dist -maxdepth 1 -name 'hma-uidfake-*.zip' -type f -print -quit)
          test -n "$zip"
          cp "$zip" build/dist/hma-uidfake-fork-latest.zip
          unzip -t build/dist/hma-uidfake-fork-latest.zip
          sha256sum build/dist/*.zip
      - name: Publish HMA UID Fake fork v0.3.5
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.5-fork
          target_commitish: ${{ github.sha }}
          name: 'HMA UID Fake fork v0.3.5 — RU/EN WebUI'
          body_path: docs/releases/v0.3.5-fork.md
          files: build/dist/*.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
